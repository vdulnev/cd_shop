name: cd_shop
description: "CD Shop - E-commerce Flutter application"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.5

  # Functional Programming (for Either type)
  dartz: ^0.10.1

  # Image Caching
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
