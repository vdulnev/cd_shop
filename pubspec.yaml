name: cd_shop
description: "CD Shop - E-commerce Flutter application"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # State Management
  equatable: ^2.0.5
  flutter_riverpod: ^3.2.0

  # Routing
  go_router: ^17.0.1

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.3.5

  # Functional Programming (for Either type)
  dartz: ^0.10.1

  # Image Caching
  cached_network_image: ^3.3.1

  # Reactive utilities (BehaviorSubject)
  rxdart: ^0.28.0

  # Cryptography
  crypto: ^3.0.3

  # UUID generation
  uuid: ^4.4.0

  # Logging
  talker: ^5.1.13
  talker_flutter: ^5.1.13
  talker_riverpod_logger: ^5.1.13

  # Icons font used by CupertinoIcons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
