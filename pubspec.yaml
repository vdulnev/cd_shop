name: cd_shop
description: "CD Shop - E-commerce Flutter application"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # State Management
  equatable: ^2.0.5
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.5

  # Functional Programming (for Either type)
  dartz: ^0.10.1

  # Image Caching
  cached_network_image: ^3.3.1

  # Reactive utilities (BehaviorSubject)
  rxdart: ^0.27.7

  # Local Database
  floor: ^1.5.0
  sqflite: ^2.3.0

  # Cryptography
  crypto: ^3.0.3

  # UUID generation
  uuid: ^4.4.0

  # Icons font used by CupertinoIcons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  floor_generator: ^1.5.0

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
